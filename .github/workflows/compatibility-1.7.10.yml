name: Minecraft 1.7.10 compatibility checks

on:
  push:
    branches: [main, develop, cheatbreaker-1.7.10]
    paths:
      - "compatibility/1.7.10/**"
      - "tools/diagnostics/**"
      - ".github/workflows/compatibility-1.7.10.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "compatibility/1.7.10/**"
      - "tools/diagnostics/**"
      - ".github/workflows/compatibility-1.7.10.yml"
  workflow_dispatch:

jobs:
  java-compatibility-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Run compatibility tests
        working-directory: compatibility/1.7.10
        run: gradle --no-daemon clean test

  powershell-diagnostic-syntax:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate diagnostic script syntax
        shell: pwsh
        run: |
          $scriptPath = "tools/diagnostics/Get-CheatBreakerProcessInfo.ps1"
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $scriptPath),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "PowerShell syntax OK: $scriptPath"
